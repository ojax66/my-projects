name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe dos scripts shell
        run: bash -n scripts/*.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning scripts/*.sh

      - name: Scripts Python
        run: |
          python3 -m py_compile scripts/mcpack.py scripts/uploader.py
          python3 scripts/mcpack.py --data "$RUNNER_TEMP/data" list

      - name: Testes
        run: |
          pip install --quiet pyyaml
          python3 tests/test_mcpack.py
          python3 tests/test_uploader.py
          python3 tests/test_cloud_init.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt e validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: docker compose config
        run: |
          cp server/.env.example server/.env
          docker compose -f server/docker-compose.yml config >/dev/null
